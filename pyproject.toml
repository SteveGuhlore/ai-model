[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-studio"
version = "0.1.0"
description = "Self-hosted SFW talking-avatar studio: likeness image gen, voice, and lip-synced video with safety guardrails."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "requests>=2.31",
    "pillow>=10.0",
]

[project.optional-dependencies]
# The heavy ML stack. Install on the GPU VM (see scripts/provision_vm.sh).
ml = [
    "torch>=2.2",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.29",
    "safetensors>=0.4",
    "TTS>=0.22",          # Coqui XTTS-v2 voice cloning
    "imageio[ffmpeg]>=2.34",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["avatar_studio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
